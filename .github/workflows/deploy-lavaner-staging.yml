name: Deploy LAVANER staging (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout independently tested staging source
        uses: actions/checkout@v4
        with:
          ref: direct-seo-2026-10-18
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Require Cloudflare credentials before any deployment
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets; no deployment attempted."
            exit 1
          fi
      - name: Install dependencies
        run: bun install
      - name: Build Cloudflare standalone SSR version
        run: bun run build:cloudflare
      - name: Publish staging worker only, never modify DNS
        run: bunx wrangler deploy --config wrangler.jsonc
