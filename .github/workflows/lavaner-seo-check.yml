name: LAVANER SEO safety checks
on:
  push:
    branches: [direct-seo-2026-10-18]
  pull_request:
    paths:
      - "site/**"
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node site/scripts/seo-check.mjs
