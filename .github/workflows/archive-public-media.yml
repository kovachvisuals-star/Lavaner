name: Archive public LAVANER images
on:
  push:
    branches: [direct-seo-2026-10-18]
    paths:
      - 'site/scripts/sync-public-media.mjs'
      - '.github/workflows/archive-public-media.yml'
permissions:
  contents: write
jobs:
  sync-media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-seo-2026-10-18
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and validate publicly published media
        run: node site/scripts/sync-public-media.mjs
      - name: Commit independently hosted media copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public
          if git diff --cached --quiet; then
            echo "No new assets"
            exit 0
          fi
          git commit -m "assets: preserve LAVANER public images for self hosting"
          git push origin HEAD:direct-seo-2026-10-18
